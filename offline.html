<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大学生信息网 · 西安交大本科生通知聚合</title>
<!-- 加到手机主屏后像个 App：图标、开屏色、全屏无地址栏 -->
<meta name="theme-color" content="#F6F2EA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --paper:#F6F2EA;
  --paper-2:#FBF8F2;
  --ink:#191713;
  --ink-2:#57514A;
  --ink-3:#8C857A;
  --line:#E3DCD0;
  --line-2:#CFC6B7;
  --accent:#A9362B;
  --accent-bg:#F2E3DE;
  --amber:#8F6314;
  --amber-bg:#F3E9D6;
  --green:#3F6353;
  --green-bg:#E4EBE6;
  --font-serif:Georgia,"Times New Roman","Songti SC",serif;
  --font-sans:-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC","Hiragino Sans GB",sans-serif;
  --r:2px;
  --sh:0 1px 0 rgba(25,23,19,.04);
}
*{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-sans);font-size:14px;line-height:1.6;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none;}
::selection{background:var(--accent);color:var(--paper-2);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

.wrap{max-width:1160px;margin:0 auto;padding:0 28px;}

/* ---------- 顶部提示条 ---------- */
.demo{
  background:var(--ink);color:#E9E3D8;font-size:11.5px;letter-spacing:.02em;
  padding:5px 0;text-align:center;
}
.demo b{color:#fff;font-weight:600;}

/* ---------- 页头 ---------- */
header{padding:26px 0 18px;border-bottom:1px solid var(--line-2);}
.masthead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;}
.brand{display:flex;align-items:baseline;gap:12px;}
.mark{width:9px;height:22px;background:var(--accent);display:inline-block;transform:translateY(2px);}
h1{margin:0;font-size:27px;font-weight:800;letter-spacing:-.02em;line-height:1;}
.sub{margin-top:8px;font-size:12px;color:var(--ink-3);letter-spacing:.03em;}
.sub em{font-style:normal;color:var(--ink-2);}
.headright{display:flex;gap:26px;align-items:flex-end;}
.stat{text-align:right;}
.stat b{display:block;font-family:var(--font-serif);font-size:21px;font-weight:400;line-height:1.1;}
.stat span{font-size:10.5px;letter-spacing:.1em;color:var(--ink-3);}

/* ---------- 控制区 ---------- */
.controls{
  padding:0;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:var(--paper);z-index:5;
}
/* 第一行：大类（学校通知…） */
.groupline{display:flex;align-items:baseline;gap:16px;padding:9px 0 0;}
.glabel{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);padding-bottom:9px;flex:none;}
.groups{display:flex;gap:20px;flex-wrap:wrap;}
.gtab{
  font:inherit;font-size:13px;color:var(--ink-3);background:none;border:0;
  padding:0 0 9px;cursor:pointer;position:relative;letter-spacing:.01em;
}
.gtab:hover{color:var(--ink);}
.gtab[aria-pressed="true"]{color:var(--ink);font-weight:600;}
.gtab[aria-pressed="true"]::after{
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--accent);
}
.gtab .n{font-family:var(--font-serif);font-size:11px;font-weight:400;opacity:.5;margin-left:5px;}
/* 第二行：子类 + 搜索 + 排序 */
.filterline{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:11px 0;}
.filterline[hidden]{display:none;}
/* 校招流程：一行小字，只在就业大类出现。写死的是常识，不是数据，所以用最轻的样式 */
.gtab.favtab{margin-left:auto;}
/* 收藏按钮：放在每条右下角，和「原文」并排 */
.star{
  font:inherit;font-size:11.5px;background:none;border:0;padding:0;cursor:pointer;
  color:var(--ink-3);letter-spacing:.03em;transition:color .12s;
}
.star:hover{color:var(--ink);}
.star[aria-pressed="true"]{color:var(--accent);}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{
  font:inherit;font-size:12px;color:var(--ink-2);background:transparent;
  border:1px solid var(--line-2);border-radius:var(--r);
  padding:5px 11px;cursor:pointer;line-height:1;letter-spacing:.01em;
  transition:background .14s,color .14s,border-color .14s;
}
.chip:hover{border-color:var(--ink-3);color:var(--ink);}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper-2);}
.chip .n{opacity:.45;margin-left:4px;font-size:11px;}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line-2);padding:4px 2px;}
.search svg{flex:none;opacity:.4;}
.search input{
  flex:1;border:0;background:transparent;font:inherit;font-size:12.5px;color:var(--ink);
  padding:2px 0;outline:none;
}
.search input::placeholder{color:var(--ink-3);}
.sortbtn{
  font:inherit;font-size:11.5px;color:var(--ink-2);background:transparent;border:0;
  padding:5px 8px;cursor:pointer;letter-spacing:.02em;border-bottom:1px dashed var(--line-2);
}
.sortbtn:hover{color:var(--ink);}

/* ---------- 主体 ---------- */
.layout{display:grid;grid-template-columns:1fr 296px;gap:44px;padding:6px 0 60px;}
.feed{list-style:none;margin:0;padding:0;}
.item{
  display:grid;grid-template-columns:78px 1fr;gap:20px;
  padding:20px 0 19px;border-bottom:1px solid var(--line);
  transition:background .16s;
}
.item:hover{background:var(--paper-2);}
.days{border-right:1px solid var(--line);padding-right:16px;text-align:right;}
.days b{display:block;font-family:var(--font-serif);font-size:31px;font-weight:400;line-height:1;letter-spacing:-.02em;}
.days span{display:block;font-size:10px;letter-spacing:.08em;color:var(--ink-3);margin-top:5px;}
.days.hot b{color:var(--accent);}
.days.warm b{color:var(--amber);}
.days.cool b{color:var(--green);}
.days.past b{color:var(--ink-3);font-size:22px;}
.days.col .days span{color:var(--accent);}

.body{min-width:0;}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
.tag{
  font-size:10.5px;letter-spacing:.04em;line-height:1;padding:3px 7px;
  border:1px solid var(--line-2);border-radius:var(--r);color:var(--ink-2);
}
.tag.cat{background:var(--paper-2);color:var(--ink);border-color:var(--line-2);font-weight:600;}
.tag.pin{color:var(--accent);border-color:#E0B9B2;background:var(--accent-bg);}
.tag.job{color:var(--ink);background:#EDF1EC;border-color:#CFD8CB;font-weight:600;}
.tag.pro{color:var(--accent);border-color:#D9B7AF;background:#FBF0EC;font-weight:600;}
.tag.new{color:#fff;background:var(--accent);border-color:var(--accent);font-weight:600;letter-spacing:.06em;padding:0 5px;}
.statbtn{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:right;}
.statbtn:hover b{color:var(--accent);}
.statbtn[aria-pressed="true"] b{color:var(--accent);}
.chip.newchip{font-weight:600;}
.chip.newchip[aria-pressed="true"]{color:var(--accent);border-color:var(--accent);}
.item h2{
  margin:0 0 6px;font-size:16.5px;font-weight:650;line-height:1.45;letter-spacing:-.005em;
}
.item h2 a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;}
.desc{margin:0 0 10px;font-size:12.5px;color:var(--ink-2);line-height:1.65;max-width:62ch;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
/* 岗位的「薪资 / 要求」：比摘要再小一号，跟在摘要下面 */
.kv{display:flex;gap:10px;margin:0 0 8px;font-size:12px;line-height:1.6;max-width:62ch;}
.kv .k{flex:0 0 auto;color:var(--ink-3);letter-spacing:.1em;}
.kv .v{color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.kv .v.sal{color:var(--accent);font-weight:600;font-family:var(--font-serif);font-size:13px;letter-spacing:.02em;}
.foot{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--ink-3);letter-spacing:.02em;}
.foot .dl{color:var(--ink-2);}
.foot .dl b{font-family:var(--font-serif);font-weight:400;font-size:12.5px;}
.src::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--line-2);margin-right:6px;transform:translateY(-1px);}
.src.nodot::before{display:none;}
.foot a{margin-left:auto;color:var(--ink-2);border-bottom:1px solid var(--line-2);padding-bottom:1px;}
.foot .lk{margin-left:auto;display:flex;gap:14px;}
.foot .lk a{margin-left:0;}
.foot .lnkcopy{order:9;border:0;background:none;padding:0 0 1px;margin-left:2px;cursor:pointer;
  font:inherit;font-size:12.5px;color:var(--ink-3);border-bottom:1px solid transparent;}
.foot .lnkcopy:hover{color:var(--accent);border-bottom-color:var(--accent);}
footer .hits{vertical-align:-2px;margin-left:8px;opacity:.65;max-width:100%;}
.favtools{display:inline-block;margin-top:14px;font-size:12.5px;color:var(--ink-3);}
.favtools a,.favtools label{cursor:pointer;color:var(--ink-2);border-bottom:1px solid var(--line-2);}
.favtools a:hover,.favtools label:hover{color:var(--accent);border-color:var(--accent);}
.item.flash{animation:flash 2.6s ease-out;}
@keyframes flash{0%,55%{background:#FBF0EC;}100%{background:transparent;}}
.kv .v .res{margin-left:2px;border-bottom:1px solid var(--line-2);white-space:nowrap;}
.foot a:hover{color:var(--accent);border-color:var(--accent);}

/* ---------- 右栏 ---------- */
.rail{position:relative;}
.rail section{margin-bottom:30px;}
.rail h3{
  margin:0 0 12px;font-size:10.5px;font-weight:700;letter-spacing:.14em;
  color:var(--ink-3);text-transform:uppercase;
}
.rail .rule{height:1px;background:var(--line);margin:0 0 12px;}
.soon{list-style:none;margin:0;padding:0;}
.soon li{display:flex;gap:10px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:12.5px;line-height:1.45;}
.soon li:last-child{border-bottom:0;}
.soon b{font-family:var(--font-serif);font-weight:400;font-size:15px;color:var(--accent);flex:none;width:26px;}
.soon span{color:var(--ink-2);}

.health{list-style:none;margin:0;padding:0;font-size:12px;}
.health li{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px dotted var(--line);}
.health li:last-child{border-bottom:0;}
.dot{width:7px;height:7px;border-radius:50%;flex:none;}
.dot.ok{background:var(--green);}
.dot.warn{background:var(--amber);}
.dot.off{background:var(--line-2);}
.health .nm{flex:1;color:var(--ink-2);}
.health .st{font-size:10.5px;color:var(--ink-3);letter-spacing:.04em;}

.note{
  background:var(--paper-2);border:1px solid var(--line);border-radius:var(--r);
  padding:13px 14px;font-size:11.5px;line-height:1.7;color:var(--ink-2);
}
.note b{color:var(--ink);font-weight:650;}
.note code{
  font-family:ui-monospace,Consolas,monospace;font-size:10.5px;
  background:#EDE7DC;padding:1px 4px;border-radius:2px;
}

/* ---------- 空状态 ---------- */
.empty{display:none;padding:60px 0;text-align:center;color:var(--ink-3);font-size:13px;}
.empty b{display:block;font-family:var(--font-serif);font-size:22px;color:var(--ink-2);font-weight:400;margin-bottom:6px;}

/* ---------- 页脚 ---------- */
footer{border-top:1px solid var(--line-2);padding:18px 0 40px;font-size:11px;color:var(--ink-3);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;letter-spacing:.02em;}
footer a{border-bottom:1px solid var(--line-2);}

@media (max-width:900px){
  .layout{grid-template-columns:1fr;gap:0;}
  .rail{margin-top:34px;border-top:1px solid var(--line-2);padding-top:26px;}
  .rail{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;}
}
@media (max-width:620px){
  .wrap{padding:0 18px;}
  .srcwrap{display:none;}          /* 手机上来源列表太长，只留个数 */
  .groupline .glabel{display:none;} /* 大类标签省掉，标签本身够说明问题 */
  .groupline .groups{width:100%;gap:16px;}
  .gtab.favtab{margin-left:0;}      /* 免得换行后孤零零飘到右边 */
  h1{font-size:22px;}
  .headright{gap:18px;width:100%;justify-content:flex-start;}
  .item{grid-template-columns:56px 1fr;gap:14px;}
  .days{padding-right:10px;}
  .days b{font-size:24px;}
  .desc{-webkit-line-clamp:3;}
  .rail{grid-template-columns:1fr;}
  .foot a{margin-left:0;}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;}
}
</style>

<div class="wrap">
  <header>
    <div class="masthead">
      <div>
        <div class="brand"><i class="mark"></i><h1>大学生信息网</h1></div>
        <div class="sub">西安交通大学 · 本科生通知聚合</div>
      </div>
      <div class="headright">
        <div class="stat"><b id="s-new">—</b><span>收录条目</span></div>
        <button class="stat statbtn" id="s-today" type="button" title="只看今天新增的"><b>—</b><span>今天新增</span></button>
        <div class="stat"><b id="s-week">—</b><span>本周截止</span></div>
        <div class="stat"><b id="s-date">—</b><span>数据截至</span></div>
      </div>
    </div>
  </header>

  <div class="controls">
    <div class="groupline">
      <span class="glabel">大类</span>
      <div class="groups" id="groups"></div>
    </div>
    <div class="filterline">
      <div class="chips" id="chips"></div>
      <label class="search">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/></svg>
        <input id="q" type="search" placeholder="搜标题、关键词，比如「转专业」「四六级」" aria-label="搜索通知">
      </label>
      <button class="sortbtn" id="sort">按截止日期排序 ↓</button>
    </div>
    <!-- 类型：校招 / 社招 / 实习，同样只在「就业」里出现 -->
    <div class="filterline dirline" id="kindline" hidden>
      <span class="glabel">类型</span>
      <div class="chips" id="kinds"></div>
    </div>
    <!-- 岗位方向：只在「就业」大类里出现，其他大类没有这一行 -->
    <div class="filterline dirline" id="dirline" hidden>
      <span class="glabel">方向</span>
      <div class="chips" id="dirs"></div>
    </div>
    <!-- 职能细分：只有点了「职能」才出现 -->
    <div class="filterline dirline" id="subline" hidden>
      <span class="glabel">细分</span>
      <div class="chips" id="subs"></div>
    </div>
  </div>

  <div class="layout">
    <main>
      <ol class="feed" id="feed"></ol>

      <div class="empty" id="empty"><b>没有匹配的通知</b>换个关键词试试，或点「全部」</div>
    </main>

    <aside class="rail">
      <section>
        <h3>最近截止</h3>
        <ul class="soon" id="soon"></ul>
      </section>

      <section>
        <h3>抓取状态</h3>
        <ul class="health" id="health"></ul>
      </section>
    </aside>
  </div>

  <footer>
    <span>大学生信息网 <img class="hits" src="https://hits.sh/114514qq-ops.github.io/xjtu-info.svg?label=%E8%AE%BF%E9%97%AE&amp;color=A9362B&amp;labelColor=8C8781" alt="" loading="lazy"></span>
    <span><a href="deadlines.ics">订阅截止日历</a> · <a href="app/xjtu-info.apk" download>下载安卓版</a> · </span>
  </footer>
</div>

<script>
(function(){
  var feed=document.getElementById('feed'), empty=document.getElementById('empty'),
      chips=document.getElementById('chips'), groupsEl=document.getElementById('groups'), q=document.getElementById('q'),
      sortBtn=document.getElementById('sort'), soonEl=document.getElementById('soon'),
      healthEl=document.getElementById('health'),
      sNew=document.getElementById('s-new'), sWeek=document.getElementById('s-week'),
      sDate=document.getElementById('s-date'),
      sToday=document.getElementById('s-today'), onlyNewBtn=document.getElementById('onlyNew'),
      nNew=document.getElementById('n-new'),
      dirs=document.getElementById('dirs'), dirline=document.getElementById('dirline'),
      subs=document.getElementById('subs'), subline=document.getElementById('subline'),
      kinds=document.getElementById('kinds'), kindline=document.getElementById('kindline');
  var grp='all', cat='all', kind='all', dir='all', sub='all', asc=true, onlyNew=false, items=[], list0=[], shownCount=0, STATS={};

  function esc(v){
    return String(v==null?'':v).replace(/[&<>"]/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }
  function cls(d){
    if(d===null||d===undefined) return 'past';
    if(d<0) return 'past';
    if(d<=7) return 'hot';
    if(d<=14) return 'warm';
    return 'cool';
  }
  function shrink(t,n){
    t=String(t||'');
    return t.length>n ? t.slice(0,n)+'…' : t;
  }

  // ---------- 收藏：存在浏览器本地，不上传、不需要登录 ----------
  var FAV_KEY='xjtu.favs.v1';
  var FAVS=(function(){
    try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'{}'); }catch(e){ return {}; }
  })();
  function saveFavs(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify(FAVS)); }catch(e){} }
  function isFav(id){ return !!(id && FAVS[id]); }
  function daysLeft(dl){
    if(!dl) return null;
    var d=new Date(dl+'T00:00:00');
    if(isNaN(d)) return null;
    var t=new Date(); t.setHours(0,0,0,0);
    return Math.round((d-t)/86400000);
  }
  // 存的是整条快照，不是只存 id——这样通知从列表里滚下去、或者标题改了，收藏里还在
  function snapshot(it){
    return {id:it.id, title:it.title, url:it.url, summary:it.summary||'',
            salary:it.salary||'', require:it.require||'', jobcat:it.jobcat||'',
            deadline:it.deadline||null, source:it.source||'',
            category:it.category||'其他', group:it.group||'学校通知',
            audience:it.audience||[], saved_at:new Date().toISOString()};
  }
  function favArray(){
    return Object.keys(FAVS).map(function(k){
      var f=FAVS[k], it={};
      for(var p in f){ if(Object.prototype.hasOwnProperty.call(f,p)) it[p]=f[p]; }
      it.days_left=daysLeft(it.deadline);   // 收藏当天的天数不算数，要看今天
      return it;
    });
  }

  function renderItem(it){
    var isExam = (it.kind==='exam');
    var d=(it.days_left===undefined? null : it.days_left);
    var num=(d===null)? '—' : (d<0 ? Math.abs(d) : d);
    var lab=(d===null)? '无截止' : (d<0 ? '天前已过' : (d===0 ? '今天截止' : '天后截止'));
    if(isExam){ num='常'; lab='常设入口'; }      // 考试是常设入口，不是截止日期
    var aud=(it.audience&&it.audience.length)? it.audience.join(' · ') : '不限年级';
    var tags='<span class="tag cat">'+esc(it.category||'其他')+'</span>'
            +'<span class="tag">'+esc(aud)+'</span>';
    if(it.is_new) tags='<span class="tag new">新</span>'+tags;
    if(it.topic && it.topic!=='其他') tags+='<span class="tag">'+esc(it.topic)+'</span>';
    if(it.jobcat) tags+='<span class="tag job">'+esc(it.jobcat)+'</span>';
    if(it.job_type) tags+='<span class="tag">'+esc(it.job_type)+'</span>';
    if(it.professional) tags+='<span class="tag pro">专业</span>';
    if(d!==null && d>=0 && d<=3) tags+='<span class="tag pin">最容易错过</span>';
    var dl=isExam ? ''
         : (it.deadline ? ('截止 <b>'+esc(it.deadline.slice(5))+'</b>') : '');
    var tail= isExam
      ? '<span class="lk"><a href="'+esc(it.register_url||it.url)+'" target="_blank" rel="noopener">报名入口 ↗</a>'
        + (it.site_url && it.site_url!==it.register_url
            ? '<a href="'+esc(it.site_url)+'" target="_blank" rel="noopener">官网 ↗</a>' : '')
        + '</span>'
      : '<a href="'+esc(it.url)+'" target="_blank" rel="noopener">原文 ↗</a>'
        + '<button class="lnkcopy" type="button" data-id="'+esc(it.id||'')+'" title="复制这条的链接">链接</button>';
    var extra= isExam
      ? (it.window ? '<div class="kv"><span class="k">时间</span><span class="v">'+esc(it.window)+'</span></div>' : '')
        + ((it.tips || (it.res && it.res.length))
            ? '<div class="kv"><span class="k">资料</span><span class="v">'+esc(it.tips||'')
              + ((it.res||[]).map(function(r){
                  return ' <a class="res" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.name)+' ↗</a>';
                }).join(''))
              + '</span></div>'
            : '')
      : '';

    var li=document.createElement('li');
    li.className='item';
    li.dataset.cat=it.category||'其他';
    li.dataset.new=it.is_new?'1':'0';
    li.dataset.py=(it.py||'');
    li.dataset.group=it.group||'学校通知';
    li.dataset.id=it.id||'';
    li.dataset.days=(d===null? 9999 : d);
    li.dataset.dir=it.jobcat||'';
    li.dataset.kind=it.kind||'';
    li.dataset.sub=it.subcat||'';
    li.dataset.title=it.title+' '+(it.jobcat||'')+' '+(it.job_type||'')+' '+(it.source||'');
    li.innerHTML=
      '<div class="days '+cls(d)+'"><b>'+num+'</b><span>'+lab+'</span></div>'
      +'<div class="body">'

      +  (it.salary ? '<div class="kv"><span class="k">薪资</span><span class="v sal">'+esc(it.salary)+'</span></div>' : '')
      +  (it.require ? '<div class="kv"><span class="k">要求</span><span class="v">'+esc(it.require)+'</span></div>' : '')

      +  '<button class="star" data-id="'+esc(it.id)+'" aria-pressed="'+(isFav(it.id)?'true':'false')+'">'
      +    (isFav(it.id)?'★ 已收藏':'☆ 收藏')+'</button>'

      +'</div>';

  }

  // 大类标签：按数据里真实出现过的 group 生成，加新大类不用改这里
  function renderGroups(list){
    var map={};
    list.forEach(function(x){ var g=x.group||'学校通知'; map[g]=(map[g]||0)+1; });
    // 「就业」和「考试」是常驻大类：现在没有内容也要出现，否则用户会以为没做
    if(!('就业' in map)) map['就业']=0;
    if(!('考试' in map)) map['考试']=0;
    // 大类顺序固定：学校通知 → 就业 → 考试，其余按出现顺序排在后面
    var GORDER=['学校通知','就业','考试'];
    var names=Object.keys(map).sort(function(a,b){
      var ia=GORDER.indexOf(a), ib=GORDER.indexOf(b);
      if(ia<0) ia=90; if(ib<0) ib=90;
      return ia-ib || a.localeCompare(b);
    });
    var html='';
    html+='<button class="gtab" aria-pressed="'+(grp==='all')+'" data-group="all">全部<span class="n">'+list.length+'</span></button>';
    names.forEach(function(g){
      html+='<button class="gtab" aria-pressed="'+(grp===g)+'" data-group="'+esc(g)+'">'+esc(g)+'<span class="n">'+map[g]+'</span></button>';
    });
    html+='<button class="gtab favtab" aria-pressed="'+(grp==='fav')+'" data-group="fav">我的收藏<span class="n">'+Object.keys(FAVS).length+'</span></button>';

    // 这样即使某家公司这次 0 个岗位，标签也还在——你能看到"我接了这个源，只是它现在空着"。
    if(grp==='就业'){

  function renderHealth(sources){
    var all=(sources||[]);
    var live=all.filter(function(s){ return s.out>0; });
    var quiet=all.filter(function(s){ return !(s.out>0) && s.in>0; });
    var zero=all.filter(function(s){ return !(s.out>0) && !(s.in>0); });
    var html=live.map(function(s){
      return '<li><i class="dot ok"></i><span class="nm">'+esc(s.name)+'</span>'
            +'<span class="st">抓 '+s.in+' · 入选 '+s.out+'</span></li>';
    }).join('');
    // 抓了但 0 入选的源合成一行：挨个列出来太长，还显得像坏了
    if(quiet.length){
      html+='<li><i class="dot off"></i><span class="nm">另有 '+quiet.length+' 个源今天没有合适的通知</span>'
           +'<span class="st">'+esc(quiet.map(function(s){return s.name;}).join(' / '))+'</span></li>';
    }
    zero.forEach(function(s){
      html+='<li><i class="dot off"></i><span class="nm">'+esc(s.name)+'</span><span class="st">今天没岗位</span></li>';
    });
    ['资助中心','就业中心','图书馆','兵马俑BBS'].forEach(function(k){
      html+='<li><i class="dot off"></i><span class="nm">'+esc(k)+'</span>'
           +'<span class="st">未接入</span></li>';
    });
    healthEl.innerHTML=html;
  }

  // 数据加载：主源是本站 feed.json；打不开时依次试备用镜像（跨域也放行，靠 CORS）
  var MIRRORS = window.__MIRRORS__ || [
    'https://114514qq-ops.github.io/xjtu-info/feed.json',
    'https://cdn.jsdelivr.net/gh/114514QQ-OPS/xjtu-info@main/feed.json',
    'https://fastly.jsdelivr.net/gh/114514QQ-OPS/xjtu-info@main/feed.json'
  ];
  function fetchFeed(url){
    return fetch(url,{cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      return r.json();
    });
  }
  function tryEach(urls, i){
    i=i||0;
    if(i>=urls.length) return Promise.reject(new Error('备用地址都打不开'));
    return fetchFeed(urls[i]).catch(function(){ return tryEach(urls, i+1); });
  }

  // 单文件离线版把数据内联进 window.__FEED__：立刻画出来，再后台找新的
  var initial;
  if(window.__FEED__){
    initial = Promise.resolve(window.__FEED__);
  } else if(location.protocol === 'file:'){
    initial = tryEach(MIRRORS);
  } else {
    initial = fetchFeed('feed.json').catch(function(){ return tryEach(MIRRORS); });
  }

  // 首屏只下 feed.json（学校通知，几 KB）；就业/考试单独拉，拉完并进同一份 list0 再重画
  function loadRest(){
    var base = (location.protocol === 'file:') ? 'https://114514qq-ops.github.io/xjtu-info/' : '';
    ['feed-jobs.json','feed-exam.json'].forEach(function(f){
      var urls = [base + f];
      if(base) urls.push('https://cdn.jsdelivr.net/gh/114514QQ-OPS/xjtu-info@main/' + f);
      else urls.push('https://cdn.jsdelivr.net/gh/114514QQ-OPS/xjtu-info@main/' + f);
      tryEach(urls).then(function(d){
        var seen = {}, added = 0;
        list0.forEach(function(x){ seen[x.id] = 1; });
        (d.items || []).forEach(function(x){
          if(x.bucket === '归档' || seen[x.id]) return;
          seen[x.id] = 1; list0.push(x); added++;
        });
        if(!added) return;
        renderGroups(list0); renderChips(list0); renderSoon(list0);
        refreshHead();
        paint();
        jumpToHash();
      }).catch(function(){ /* 拉不到就算了，学校通知还能看 */ });
    });
  }

  var applied = null;
  initial
    .then(function(data){
      applied = data;
      // 只把「头条 / 列表」画出来；「归档」留在 feed.json 里备查，不参与刷屏
      var list=(data.items||[]).filter(function(x){
        return x.bucket==='头条' || x.bucket==='列表';
      });
      list0=list;
      STATS=(data.stats||{});
      renderGroups(list0); renderChips(list0); renderSoon(list0); renderHealth((data.stats&&data.stats.sources)||[]);
      sNew.textContent=list.length;
      sWeek.textContent=list.filter(function(x){
        return x.days_left!==null && x.days_left>=0 && x.days_left<=7;
      }).length;
      sDate.textContent=((data.stats&&data.stats.today)||data.today||'').slice(5) || '—';
      var sBar=document.getElementById('s-bar');
      if(sBar) sBar.textContent=((data.stats&&data.stats.today)||data.today||'');
      // 顶部黑条按真实来源生成，加一个源不用改这里
      var srcs=(data.stats&&data.stats.sources)||[];
      var nsrc=document.getElementById('s-nsrc'), ssrc=document.getElementById('s-srcs');
      if(nsrc) nsrc.textContent=srcs.length;
      if(ssrc) ssrc.textContent=srcs.map(function(x){return x.name;}).join(' / ');
      // 单文件离线版：数据是内联的快照，明确写出来，别让人以为是每天更新的
      if(window.__FEED__){
        var b=document.querySelector('.demo'), td=((data.stats&&data.stats.today)||'');
        if(b) b.innerHTML='<b>离线版</b> · 数据截至 '+esc(td||'—')+' · 这份不会自动更新，要看新的用在线版';
      }
      paint();
      refreshHead();
      loadRest();
      jumpToHash();
      if(window.__FEED__ && MIRRORS.length){
        tryEach(MIRRORS).then(function(fresh){
          var a=((applied.stats&&applied.stats.today)||''),
              b=((fresh.stats&&fresh.stats.today)||'');
          if(!b || b===a || !(fresh.items&&fresh.items.length)) return;
          window.__FEED__=null;
          var list2=(fresh.items||[]).filter(function(x){
            return x.bucket==='头条' || x.bucket==='列表';
          });
          list0=list2; STATS=(fresh.stats||{}); applied=fresh;
          renderGroups(list0); renderChips(list0); renderSoon(list0);
          renderHealth((fresh.stats&&fresh.stats.sources)||[]);
          sNew.textContent=list2.length;
          sWeek.textContent=list2.filter(function(x){
            return x.days_left!==null && x.days_left>=0 && x.days_left<=7;
          }).length;
          sDate.textContent=(b||'').slice(5) || '—';
          var sb=document.getElementById('s-bar'); if(sb) sb.textContent=b;
          var s2=(fresh.stats&&fresh.stats.sources)||[];
          var n2=document.getElementById('s-nsrc'), s3=document.getElementById('s-srcs');
          if(n2) n2.textContent=s2.length;
          if(s3) s3.textContent=s2.map(function(x){return x.name;}).join(' / ');
          var bb=document.querySelector('.demo');
          if(bb) bb.innerHTML='<b>已更新</b> · 数据截至 '+esc(b)+' · 刚连上网络抓到的';
          paint();
          refreshHead();
          loadRest();
        }).catch(function(){ /* 连不上就继续看快照，不打扰 */ });
      }
    })
    .catch(function(err){
      var box=document.createElement('div');
      box.style.cssText='margin:12px 0;padding:11px 13px;border:1px solid #E0B9B2;background:#FBF1EF;'
                      +'color:#A9362B;font-size:12.5px;line-height:1.6;border-radius:2px';
      box.innerHTML='<b>没读到 feed.json（'+esc(err.message)+'）</b><br>'
        +'如果你是把 index.html 直接双击打开的，浏览器会禁止本地 fetch。'
        +'先在这个文件夹里运行 <code>python -m http.server 8777</code>，'
        +'再访问 <code>http://127.0.0.1:8777/</code>。';
      document.querySelector('.layout').parentNode.insertBefore(
        box, document.querySelector('.layout'));
      empty.style.display='block';
      empty.innerHTML='<b>数据没加载出来</b>见上面那行提示';
    });
})();

// 离线可用：把壳和最近一次数据缓存下来，地铁里没信号也能翻
</script>
</body>
</html>
