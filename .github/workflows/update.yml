name: 每日更新

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: pip install pypinyin

      - name: 抓取
        run: python tools/crawl_jwc.py --source all --out tools/raw.json

      - name: 检查抓到的条数
        run: |
          python - <<'PY'
          import json, sys
          rows = json.load(open("tools/raw.json", encoding="utf-8"))
          print("抓到", len(rows), "条")
          sys.exit(0 if len(rows) >= 3 else 1)
          PY

      - name: 过滤（同时拆包与生成日历）
        run: python tools/filter_rules.py --input tools/raw.json --output feed.json

      - name: 提交
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feed.json feed-jobs.json feed-exam.json feed-archive.json deadlines.ics
          if git diff --cached --quiet; then
            echo "数据没变化，跳过提交"
          else
            git commit -m "update feed: $(date +%F)"
            git push
          fi
